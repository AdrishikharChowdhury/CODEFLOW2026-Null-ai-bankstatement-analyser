[project]
name = "server"
version = "0.1.0"
description = "FastAPI server optimized for GenAI and text embeddings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.47.0",
    "google-genai>=2.6.0",
    "python-dotenv>=1.0.1",
    "supabase>=2.30.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "plotly>=5.20.0",
    "pdfplumber>=0.11.0",
    "pymupdf>=1.24.0",
    "httpx>=0.27.0",
]

[tool.uv]
managed = true
compile-bytecode = false